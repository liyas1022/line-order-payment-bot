<text x="923" y="309" font-size="13" fill="#253044" font-weight="400" text-anchor="start">速3</text>
<text x="840" y="337" font-size="12" fill="#7c8795" font-weight="400" text-anchor="start">訂單編號</text>
<text x="923" y="337" font-size="13" fill="#253044" font-weight="400" text-anchor="start">DEMO-ORDER-300</text>
<rect x="840" y="356" width="300" height="76" rx="10" fill="#f5f7f9"/>
<text x="856" y="382" font-size="12" fill="#7c8795" font-weight="400" text-anchor="start">模擬繳費代碼</text>
<text x="856" y="414" font-size="25" fill="#253044" font-weight="700" text-anchor="start">123456789012</text>
<text x="840" y="456" font-size="12" fill="#7c8795" font-weight="400" text-anchor="start">付款時間</text>
<text x="923" y="456" font-size="13" fill="#253044" font-weight="400" text-anchor="start">模擬付款完成</text>
<rect x="840" y="477" width="300" height="43" rx="9" fill="#edf2ef"/>
<text x="990.0" y="504" font-size="14" fill="#365340" font-weight="600" text-anchor="middle">查詢最新狀態</text>
<text x="990" y="594" font-size="11" fill="#87918e" font-weight="400" text-anchor="middle">作品集模擬流程，代碼不可實際繳費。</text>
<text x="34" y="641" font-size="13" fill="#69816f" font-weight="400" text-anchor="start">Flask · SQLite · LINE Messaging API · Mock Payment Service</text>
