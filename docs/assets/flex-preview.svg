<text x="466" y="414" font-size="25" fill="#253044" font-weight="700" text-anchor="start">123456789012</text>
<text x="450" y="456" font-size="12" fill="#7c8795" font-weight="400" text-anchor="start">繳費期限</text>
<text x="533" y="456" font-size="13" fill="#253044" font-weight="400" text-anchor="start">建立後 2 小時內</text>
<rect x="450" y="477" width="300" height="43" rx="9" fill="#06c755"/>
<text x="600.0" y="504" font-size="14" fill="#ffffff" font-weight="600" text-anchor="middle">模擬付款（不扣款）</text>
<rect x="450" y="528" width="300" height="43" rx="9" fill="#edf2ef"/>
<text x="600.0" y="555" font-size="14" fill="#365340" font-weight="600" text-anchor="middle">查詢最新狀態</text>
<text x="600" y="594" font-size="11" fill="#87918e" font-weight="400" text-anchor="middle">作品集模擬流程，代碼不可實際繳費。</text>
<rect x="814" y="130" width="352" height="88" rx="16" fill="#f0faf4"/>
<rect x="814" y="190" width="352" height="28" rx="0" fill="#f0faf4"/>
